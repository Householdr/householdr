name: '🗃️ Artifact: Restore build'
description: Downloads the build artifact and unpacks it into the workspace, so a job runs without installing or building again.

inputs:
  name:
    description: Name of the build artifact
    default: build

runs:
  using: composite
  steps:
    - name: '🗃️ Artifact: Restore'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/${{ inputs.name }}

    - name: '🗃️ Artifact: Unpack'
      shell: bash
      env:
        ARCHIVE: ${{ runner.temp }}/${{ inputs.name }}/build.tar.zst
      run: tar --zstd -xf "$ARCHIVE"
