name: '📦 Dependencies: Setup Node.js and pnpm'
description: Installs Node.js from a version file and pnpm from package.json's packageManager field.

inputs:
  node-version-file:
    description: File that holds the Node.js version
    default: .node-version
  cache:
    description: Whether to cache the pnpm store (only useful in a job that installs)
    default: 'true'

runs:
  using: composite
  steps:
    - name: '📦 Dependencies: Setup Node.js'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        package-manager-cache: false

    - name: '📦 Dependencies: Setup pnpm'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.cache }}
