# The pull request's title, on every change to it (ADR-0009 §2, §3; PROC-8, PROC-10).
name: '🔀 Pull request title'

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer event cancels the run for the previous one. Draft and ready runs are kept apart, so marking
# a draft ready doesn't cancel the draft's run on the same commit.
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  title:
    name: '🧹 Lint: PR title'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # PROC-8 and ADR-0009 §2 for the title; PROC-10 for feat pull requests.
      - name: '🧹 Lint: PR title'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          header='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z0-9]'
          if [[ ! "$TITLE" =~ $header ]]; then
            echo "::error title=PR title::Use a Conventional Commit header, 'type(scope): description' with a lower-case description (PROC-8)."
            exit 1
          fi
          if [[ "$TITLE" =~ ^feat ]] && [[ ! "$BODY" =~ ADR-[0-9]{4} ]]; then
            echo "::error title=PR description::A feat pull request names the ADR it implements, as 'Implements ADR-NNNN' (PROC-10)."
            exit 1
          fi
