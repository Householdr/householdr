# What runs on a pull request's code (ADR-0009 §3): the pipeline only for a pull request that is
# ready for review and changes more than documentation, with end-to-end tests only into `main`
# (ADR-0027 §2). `🚦 Pipeline: Result` reports the outcome as one check that always runs, so it can be
# required whether the pipeline ran or was skipped (ADR-0024 §2). Into any other branch, such as a
# feature branch, it is `🚦 Pipeline: Result (feature)`, so a pull request retargeted to `main` has no
# result `main` accepts until a run against `main` reports one. The title has a workflow of its own,
# so editing it never replaces that result; nor does a change of base, which starts no run.
name: '🔀 Pull request'

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A new push cancels the run for the previous one. Draft and ready runs are kept apart, so marking a
# draft ready doesn't cancel the draft's run on the same commit, whose result would then fail.
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

jobs:
  changes:
    name: '📂 Source: Changed files'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: read
    outputs:
      code-changed: ${{ steps.changes.outputs.code-changed }}
    steps:
      - name: '📂 Source: Changed files'
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api --paginate "repos/${REPOSITORY}/pulls/${NUMBER}/files" --jq '.[].filename')
          code=$(grep -v -E '^docs/|\.md$' <<< "$files" || true)
          if [[ -n "$code" ]]; then changed=true; else changed=false; fi
          echo "code-changed=${changed}" >> "$GITHUB_OUTPUT"

  pipeline:
    name: '🚦 Pipeline'
    needs: changes
    if: >-
      !github.event.pull_request.draft
      && needs.changes.outputs.code-changed == 'true'
      && !startsWith(github.head_ref, 'release-please--')
    uses: ./.github/workflows/pipeline.yml
    with:
      e2e: ${{ github.base_ref == 'main' }}

  # Runs even when the pipeline failed or was cancelled, so a missing result can never count as a pass.
  result:
    name: "${{ github.base_ref == 'main' && '🚦 Pipeline: Result' || '🚦 Pipeline: Result (feature)' }}"
    needs: [changes, pipeline]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: '🚦 Pipeline: Result'
        env:
          CHANGES: ${{ needs.changes.result }}
          PIPELINE: ${{ needs.pipeline.result }}
        run: |
          echo "Change detection: ${CHANGES}. Pipeline: ${PIPELINE}."
          if [[ "$CHANGES" != success ]]; then
            echo "::error title=Pipeline::Change detection ended as '${CHANGES}'."
            exit 1
          fi
          if [[ "$PIPELINE" != success && "$PIPELINE" != skipped ]]; then
            echo "::error title=Pipeline::The pipeline ended as '${PIPELINE}'."
            exit 1
          fi
