# Install and build once, then check from that build (ADR-0009 §5). Called by other workflows only.
name: '🚦 Pipeline'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: 🛠️ Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: '📂 Source: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '📦 Dependencies: Setup'
        uses: ./.github/actions/setup-node-pnpm

      - name: '📦 Dependencies: Install'
        run: pnpm install --frozen-lockfile

      - name: '📦 Dependencies: Audit'
        run: pnpm audit --prod --audit-level high

      - name: '🛠️ Bundle: Build'
        run: pnpm build

      # One archive keeps pnpm's symlinks and file modes intact.
      - name: '🗃️ Artifact: Pack'
        run: tar --zstd --exclude=.git -cf "$RUNNER_TEMP/build.tar.zst" .

      - name: '🗃️ Artifact: Upload'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  verify:
    name: 🔎 Verify
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history, so the secret scan can read every commit of the pull request.
      - name: '📂 Source: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: '📦 Dependencies: Setup'
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: 'false'

      - name: '🗃️ Artifact: Restore'
        uses: ./.github/actions/restore-build

      # Every check runs even when an earlier one failed, so one run reports every problem.
      - name: '🧹 Lint: ESLint'
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: '💅 Format: Prettier'
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: '🔎 Types: tsc'
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: '🧪 Test: Unit'
        if: ${{ !cancelled() }}
        run: pnpm test --reporter=default --reporter=github-actions

      - name: '🧹 Lint: Flag expiry'
        if: ${{ !cancelled() }}
        run: pnpm flags:check

      # The same scan as the pre-commit hook, over the pull request's commits (ADR-0021 §4).
      # Keep the version in step with .pre-commit-config.yaml.
      - name: '🧹 Lint: Secrets'
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="${BASE_SHA}..${HEAD_SHA}" .
