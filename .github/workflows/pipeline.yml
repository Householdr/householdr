# Install and build once, then check from that build (ADR-0009 §5). Called by other workflows only.
name: '🚦 Pipeline'

on:
  workflow_call:

permissions:
  contents: read

jobs:
  bundle:
    name: 🛠️ Bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: '📂 Source: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '📦 Dependencies: Setup'
        uses: ./.github/actions/setup-node-pnpm

      - name: '📦 Dependencies: Install'
        run: pnpm install --frozen-lockfile

      - name: '📦 Dependencies: Audit'
        run: pnpm audit --prod --audit-level high

      - name: '🛠️ Bundle: Build'
        run: pnpm build

      # One archive keeps pnpm's symlinks and file modes intact.
      - name: '🗃️ Artifact: Pack'
        run: tar --zstd --exclude=.git -cf "$RUNNER_TEMP/build.tar.zst" .

      - name: '🗃️ Artifact: Upload'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: ${{ runner.temp }}/build.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  verify:
    name: 🔎 Verify
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A throwaway PostgreSQL on the current major for the database tests (TEST-11). It lives only as
    # long as this job and is reachable only from it, so it needs no password.
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336 # 18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      # Full history, so the secret scan can read every commit of the pull request.
      - name: '📂 Source: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: '📦 Dependencies: Setup'
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: 'false'

      - name: '🗃️ Artifact: Restore'
        uses: ./.github/actions/restore-build

      # Every check runs even when an earlier one failed, so one run reports every problem.
      - name: '🧹 Lint: ESLint'
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: '🧹 Lint: Import cycles'
        if: ${{ !cancelled() }}
        run: pnpm deps:check

      - name: '💅 Format: Prettier'
        if: ${{ !cancelled() }}
        run: pnpm format:check

      - name: '🔎 Types: tsc'
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: '🧪 Test: Unit'
        if: ${{ !cancelled() }}
        env:
          TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
        run: pnpm test --reporter=default --reporter=github-actions

      - name: '🧹 Lint: Flag expiry'
        if: ${{ !cancelled() }}
        run: pnpm flags:check

      # Every maintained language has every message, with the same placeholders (ADR-0016 §4).
      - name: '🧹 Lint: Messages'
        if: ${{ !cancelled() }}
        run: pnpm messages:check

      # The same scan as the pre-commit hook, over the pull request's commits (ADR-0021 §4).
      # Keep the version in step with .pre-commit-config.yaml.
      - name: '🧹 Lint: Secrets'
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="${BASE_SHA}..${HEAD_SHA}" .

  # End-to-end and accessibility tests in Chromium, against the built app (ADR-0009 §4, §5).
  e2e:
    name: '🧪 Test: E2E'
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: '📂 Source: Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '📦 Dependencies: Setup'
        uses: ./.github/actions/setup-node-pnpm
        with:
          cache: 'false'

      - name: '🗃️ Artifact: Restore'
        uses: ./.github/actions/restore-build

      # The browser is cached per Playwright version; the system libraries it needs are not.
      - name: '📦 Dependencies: Playwright version'
        id: playwright
        run: echo "version=$(pnpm --filter @householdr/web exec playwright --version)" >> "$GITHUB_OUTPUT"

      - name: '📦 Dependencies: Browser cache'
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: '📦 Dependencies: Browser'
        run: |
          if [[ "$CACHED" == true ]]; then
            pnpm --filter @householdr/web exec playwright install-deps chromium
          else
            pnpm --filter @householdr/web exec playwright install --with-deps chromium
          fi
        env:
          CACHED: ${{ steps.browser.outputs.cache-hit }}

      - name: '🧪 Test: E2E'
        run: pnpm test:e2e

      # Traces and screenshots of the failures, for a few days (ADR-0009 §9).
      - name: '🗃️ Artifact: Upload report'
        id: report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 3

      - name: '🗃️ Artifact: Link report'
        if: ${{ failure() && steps.report.outputs.artifact-url }}
        env:
          URL: ${{ steps.report.outputs.artifact-url }}
        run: echo "End-to-end tests failed, see the [Playwright report]($URL)." >> "$GITHUB_STEP_SUMMARY"
