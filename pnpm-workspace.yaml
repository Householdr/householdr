packages:
  - apps/*
  - packages/*

# One version of each external dependency for the whole workspace (PRIN-3). Packages refer to it
# as `catalog:`; `pnpm add` records new dependencies here, and unused entries are removed.
catalog:
  '@axe-core/playwright': ^4.13.0
  '@e18e/eslint-plugin': ^0.8.1
  '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
  '@eslint/js': ^10.0.1
  '@eslint/json': ^2.1.0
  '@flipt-io/flipt-client-js': ^0.6.0
  '@inlang/paraglide-js': ^2.25.4
  '@inlang/plugin-message-format': ^4.4.4
  '@internationalized/date': ^3.12.4
  '@opentelemetry/api': ^1.9.1
  '@playwright/test': ~1.63.0
  '@sveltejs/adapter-node': ^6.0.0
  '@sveltejs/kit': ^3.0.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@tailwindcss/vite': ^4.3.3
  '@types/node': ^26.6.4
  '@types/pg': ^8.23.1
  better-auth: ^1.7.7
  bits-ui: ^2.19.5
  cn: ^0.4.0
  dependency-cruiser: ^18.5.0
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.3
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-svelte: ^3.23.0
  fast-check: ^4.10.2
  knip: ^6.39.0
  nodemailer: ^10.0.14
  pg: ^8.23.1
  pg-boss: ^12.36.0
  prettier: ^3.9.9
  prettier-plugin-svelte: ^4.1.1
  prettier-plugin-tailwindcss: ^0.8.1
  rrule-temporal: ^2.2.8
  svelte: ^5.57.1
  svelte-check: ^4.7.6
  tailwind-variants: ^3.3.1
  tailwindcss: ^4.3.3
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  valibot: ^1.5.0
  vite: ^8.3.2
  vitest: ^5.0.3
catalogMode: strict
catalogPrune: true

# Supply chain (ADR-0017 §8): only accept package versions that have been public for three days,
# and run no install scripts unless they are allowed here.
minimumReleaseAge: 4320
allowBuilds:
  # drizzle-kit's esbuild finds its platform binary without its install script.
  esbuild: false

engineStrict: true
