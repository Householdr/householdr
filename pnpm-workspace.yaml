packages:
  - apps/*
  - packages/*

# One version of each external dependency for the whole workspace (PRIN-3). Packages refer to it
# as `catalog:`; `pnpm add` records new dependencies here, and unused entries are removed.
catalog:
  '@eslint-community/eslint-plugin-eslint-comments': ^4.8.1
  '@eslint/js': ^10.0.1
  '@sveltejs/adapter-node': ^6.0.0
  '@sveltejs/kit': ^3.0.0
  '@sveltejs/vite-plugin-svelte': ^7.3.1
  '@types/node': ^26.6.4
  eslint: ^10.12.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.9
  svelte: ^5.57.1
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vite: ^8.3.2
  vitest: ^5.0.3
catalogMode: strict
catalogPrune: true

# Supply chain (ADR-0017 §8): only accept package versions that have been public for three days,
# and run no install scripts unless they are allowed here.
minimumReleaseAge: 4320
allowBuilds: {}

engineStrict: true
